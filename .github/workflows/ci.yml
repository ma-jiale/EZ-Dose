name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - '.github/workflows/ci.yml'
            server:
              - 'apps/server/**'
              - '.github/workflows/ci.yml'
            integration:
              - 'apps/server/**'
              - 'docker-compose.yml'
              - '.dockerignore'
              - '.env.example'
              - '.github/workflows/ci.yml'

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --debug

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  integration:
    needs:
      - changes
      - server
    if: |
      always() &&
      needs.changes.outputs.integration == 'true' &&
      (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 60
      - run: curl --fail http://127.0.0.1:8000/health/live
      - if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - if: always()
        run: docker compose down -v --remove-orphans

  gate:
    if: always()
    needs:
      - changes
      - client
      - server
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI
        shell: bash
        run: |
          results=(
            "${{ needs.client.result }}"
            "${{ needs.server.result }}"
            "${{ needs.integration.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
